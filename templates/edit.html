<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo編集 - Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
        }
        
        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ Todo編集</h1>
        
        <form action="/edit/{{ todo.id }}" method="POST">
            <div class="form-group">
                <label for="title">タイトル</label>
                <input type="text" id="title" name="title" value="{{ todo.title }}" required>
            </div>
            
            <div class="form-group">
                <label for="desc">内容</label>
                <input type="text" id="desc" name="desc" value="{{ todo.description or '' }}">
            </div>
            
            <div class="form-group">
                <label for="deadline">期日</label>
                <input type="date" id="deadline" name="deadline" value="{{ todo.deadline or '' }}">
            </div>
            
            <div class="form-group">
                <label for="priority">重要度</label>
                <select id="priority" name="priority">
                    <option value="urgent" {% if todo.priority == 'urgent' %}selected{% endif %}>締め切り間近</option>
                    <option value="important" {% if todo.priority == 'important' %}selected{% endif %}>急ぎでないけど重要</option>
                    <option value="normal" {% if todo.priority == 'normal' %}selected{% endif %}>まだ余裕あり</option>
                </select>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary">更新</button>
                <a href="/">
                    <button type="button" class="btn-secondary">キャンセル</button>
                </a>
            </div>
        </form>
    </div>
</body>
</html>
